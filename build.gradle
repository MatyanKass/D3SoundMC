plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"d3sound" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

base {
	// имя сборки говорит само за себя: загрузчик, версия игры, мод и его версия
	archivesName = "fabric-${project.minecraft_version}_d3SoundMC"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// Числовой стенд: считает акустику и сверяет с физикой, без единого звука
tasks.register('bench', JavaExec) {
	group = 'verification'
	description = 'Прогнать числовые проверки движка (тихо, без вывода в динамики)'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'dev.d3sound.mc.bench.Bench'
	defaultCharacterEncoding = 'UTF-8'
	jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8'
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
